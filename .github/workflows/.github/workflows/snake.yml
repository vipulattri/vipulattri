name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"  # Runs daily at midnight
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Snake Animation
        uses: Platane/snk@master
        with:
          github_user_name: vipulattri
          outputs: |
            dist/snake.svg
      - name: Upload the SVG to the output branch
        uses: actions/upload-artifact@v3
        with:
          name: snake-artifact
          path: dist/snake.svg
